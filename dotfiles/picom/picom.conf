########################################
# BACKEND
########################################

backend = "glx";

vsync = true;

# Avoid unnecessary framebuffer copies.
glx-copy-from-front = false;


########################################
# GENERAL
########################################

# Don't repaint the entire screen unnecessarily.
use-damage = true;

# Avoid fading destroyed ARGB windows.
no-fading-destroyed-argb = true;

# Use the WM's frame extents when determining shadows.
detect-client-opacity = true;
detect-rounded-corners = true;


########################################
# SHADOWS
########################################

shadow = true;

shadow-radius = 12;
shadow-opacity = 0.28;

shadow-offset-x = -8;
shadow-offset-y = -8;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c",

  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "window_type = 'utility'"
];


########################################
# FADING
########################################

fading = true;

fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;

# Don't fade menus/tooltips.
fade-exclude = [
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'"
];


########################################
# OPACITY
########################################

active-opacity = 1.0;
inactive-opacity = 0.94;
frame-opacity = 1.0;

inactive-dim = 0.0;

# Application-specific opacity.
opacity-rule = [
  "94:class_g = 'kitty'",
  "94:class_g = 'Alacritty'",

  "100:class_g = 'librewolf'",
  "100:class_g = 'firefox'",

  "100:class_g = 'Gimp'",
  "100:class_g = 'Ardour'",
  "100:class_g = 'Renoise'"
];


########################################
# BLUR
########################################

blur-background = false;

blur-method = "kernel";
blur-kern = "3x3box";

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",

  # Don't blur fullscreen applications.
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];


########################################
# ROUNDED CORNERS
########################################

corner-radius = 8;

rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",

  "class_g = 'Gimp'",
  "class_g = 'Ardour'",
  "class_g = 'Renoise'"
];


########################################
# WINDOW TYPES
########################################

wintypes = {
  tooltip = {
    fade = true;
    shadow = true;
    opacity = 0.95;
    focus = true;
  };

  dock = {
    shadow = false;
    blur-background = false;
    opacity = 1.0;
  };

  dnd = {
    shadow = false;
  };

  popup_menu = {
    opacity = 0.98;
    shadow = true;
    fade = true;
  };

  dropdown_menu = {
    opacity = 0.98;
    shadow = true;
    fade = true;
  };
};


########################################
# PERFORMANCE
########################################

# Avoid unnecessary synchronization.
unredir-if-possible = true;

# Don't unredirect fullscreen applications that need compositing.
unredir-if-possible-delay = 0;
