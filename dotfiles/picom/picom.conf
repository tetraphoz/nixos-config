# This is a sample picom.conf file with a focus on animations and smooth visual effects.
# You can copy this file to ~/.config/picom.conf and customize it.

#################################
#       BACKEND & VSYNC         #
#################################

# Use the GLX backend for better performance with most modern GPUs, especially
# with animations and blur.
backend = "glx";

# VSync helps prevent screen tearing. The `opengl` method is often a good choice.
vsync = true;
#glx-no-stencil = true;
glx-copy-from-front = false;
glx-use-copysubbuffermesa = true;

#################################
#           SHADOWS             #
#################################

# Enabled client-side shadows on windows.
shadow = true;

# The blur radius for shadows, in pixels.
shadow-radius = 15;

# The opacity of shadows.
shadow-opacity = 0.25;

# The horizontal and vertical offset for shadows.
shadow-offset-x = -15;
shadow-offset-y = -15;

# Exclude shadows on specific windows to prevent visual glitches.
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'"
];

#################################
#          FADING               #
#################################

# Fade windows in/out when opening/closing and when opacity changes.
fading = true;

# Opacity change between steps while fading in.
fade-in-step = 0.05;

# Opacity change between steps while fading out.
fade-out-step = 0.05;

# The time between steps in fade step, in milliseconds.
fade-delta = 10;

# Do not fade destroyed ARGB windows with WM frame.
# This is a workaround for bugs in some window managers.
no-fading-destroyed-argb = true;

#################################
#        ANIMATIONS             #
#################################

# To enable animations, you must be using a version of picom that supports them.
# The official `yshui` fork and other modern forks have this functionality.
animations = true;

# This section defines rules for when and how animations should be applied.
# The 'triggers' array specifies the events that will cause an animation.
# `preset` defines the type of animation (e.g., fly-in, scale, zoom).
# `direction` specifies the direction for fly-in/fly-out animations.
# `duration` is the length of the animation in seconds.
animation-rules = [
  # "Open" animation: fly-in from the bottom for new windows.
  "fly-in;100;ease-out-cubic;0.3;window_type = 'normal'",
  
  # "Close" animation: fly-out to the top for closing windows.
  "fly-out;100;ease-out-cubic;0.3;window_type = 'normal'",
  
  # A separate animation for floating windows, like popups or dialogs.
  # This can help distinguish them visually.
  "scale;100;ease-out-back;0.2;window_type = 'dialog'",
  "scale;100;ease-out-back;0.2;window_type = 'utility'",
  "scale;100;ease-out-back;0.2;window_type = 'menu'",

  # You can also apply specific animations to floating windows.
  "fly-in;100;ease-out-cubic;0.2;window_type = 'normal' && class_g = 'floating'",
  "fly-out;100;ease-out-cubic;0.2;window_type = 'normal' && class_g = 'floating'",
  
  # Animation for workspace switches (if supported by your picom version and WM).
  # Note: This may not work with all window managers, including xmonad, which
  # handles workspace switching differently.
  "slide-in;100;ease-out-cubic;0.3;focused_workspace_changed",
  "slide-out;100;ease-out-cubic;0.3;unfocused_workspace_changed",
];

# General animation settings for fine-tuning.
# These values are for the `pijulius` fork of picom, and may not apply to
# all versions.
animation-for-open-window = "zoom";
animation-for-transient-window = "fly-in";
animation-for-unmap-window = "zoom";
animation-stiffness = 350;
animation-dampening = 20;

#################################
#       OPACITY & BLUR          #
#################################

# Set default opacity for active and inactive windows.
# You may want to use `opacity-rule` for more granular control.
active-opacity = 1.0;
inactive-opacity = 0.9;
frame-opacity = 1.0;

# Dim inactive windows.
inactive-dim = 0.0;

# Blur background of transparent windows.
blur-background = true;
blur-method = "kernel";
blur-kern = "3x3box";

# Exclude certain windows from background blur.
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#         WINDOW RULES          #
#################################

# Opacity rules for specific applications.
# Replace 'URxvt' and 'Alacritty' with your terminal of choice.
opacity-rule = [
  "85:class_g = 'URxvt'",
  "90:class_g = 'Alacritty'",
  "100:class_g = 'librewolf'",
  "100:class_g = 'brave-browser'"
];

# Rounded corners.
# This setting may not work with all window managers and can sometimes cause
# visual glitches. Use with caution.
#corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'normal' && class_g = 'Gimp'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

