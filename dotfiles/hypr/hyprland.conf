$mainMod = SUPER
$terminal = kitty
$menu = wofi --show drun

# Monitor settings are managed graphically with nwg-displays.
source = ~/.config/hypr/monitors.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper
exec-once = ~/.local/bin/hypr-random-wallpaper

input {
  kb_layout = us
  kb_variant = altgr-intl
  follow_mouse = 1
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  layout = master
}

master {
  orientation = left
  mfact = 0.50
}

decoration {
  rounding = 6
}

animations {
  enabled = yes
  animation = windows, 1, 2, default
  animation = windowsIn, 1, 2, default
  animation = windowsOut, 1, 2, default
  animation = workspaces, 1, 2, default
  animation = specialWorkspace, 1, 2, default
  animation = fade, 1, 2, default
}

# XMonad's named scratchpads, backed by Hyprland special workspaces.
windowrule = match:class ^(scratch)$, float on
windowrule = match:class ^(scratch)$, size 50% 50%
windowrule = match:class ^(scratch)$, center on
windowrule = match:class ^(scratch)$, workspace special:terminal silent
windowrule = match:class ^(scratchNcm)$, float on
windowrule = match:class ^(scratchNcm)$, size 80% 80%
windowrule = match:class ^(scratchNcm)$, center on
windowrule = match:class ^(scratchNcm)$, workspace special:ncmpcpp silent

# Core XMonad-compatible bindings.
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, exec, hyprctl reload
bind = $mainMod CTRL, Q, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, Q, exit
bind = $mainMod SHIFT, C, killactive
bind = $mainMod SHIFT, X, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, T, togglefloating
bind = $mainMod, V, togglefloating
bind = $mainMod CTRL, T, togglefloating

# Focus, master sizing, and window ordering.
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, M, layoutmsg, focusmaster
bind = $mainMod SHIFT, M, layoutmsg, swapwithmaster
bind = $mainMod, H, layoutmsg, mfact -0.05
bind = $mainMod, L, layoutmsg, mfact +0.05
bind = $mainMod, comma, layoutmsg, addmaster
bind = $mainMod, period, layoutmsg, removemaster
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0
bind = $mainMod CTRL SHIFT, J, layoutmsg, orientationleft
bind = $mainMod CTRL SHIFT, K, layoutmsg, orientationright
bind = $mainMod, space, layoutmsg, orientationnext
bind = $mainMod CTRL, space, layoutmsg, orientationprev
bind = $mainMod, S, exec, ~/.local/bin/hypr-toggle-border

# Workspaces; retain the convenient direct Super+1..5 bindings too.
bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1
bind = $mainMod SHIFT, left, exec, hyprctl dispatch movetoworkspace e-1 && hyprctl dispatch workspace e-1
bind = $mainMod SHIFT, right, exec, hyprctl dispatch movetoworkspace e+1 && hyprctl dispatch workspace e+1
bind = $mainMod, grave, workspace, previous
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Xmobar's strut toggle becomes a Waybar visibility toggle.
bind = $mainMod, B, exec, pkill -SIGUSR1 waybar

# Application shortcuts.
bind = $mainMod SHIFT, F, exec, librewolf
bind = $mainMod SHIFT, T, exec, thunar
bind = $mainMod SHIFT, E, exec, thunar
bind = $mainMod, P, exec, rofipass
bind = $mainMod, O, exec, emacsclient -ca ''
bind = $mainMod, I, exec, emacsclient -cn -e '(emacs-everywhere)'
bind = $mainMod, A, exec, ~/.local/bin/hypr-window-picker
bind = $mainMod, G, exec, ~/.local/bin/hypr-window-picker
bind = $mainMod SHIFT, G, exec, ~/.local/bin/hypr-window-picker bring

# Scratchpads, lock, and screenshots.
bind = $mainMod, BackSpace, exec, ~/.local/bin/hypr-scratchpad terminal
bind = $mainMod SHIFT, Y, exec, ~/.local/bin/hypr-scratchpad ncmpcpp
bind = $mainMod SHIFT, N, movetoworkspace, special:minimized
bind = $mainMod CTRL SHIFT, N, togglespecialworkspace, minimized
bind = $mainMod SHIFT, L, exec, hyprlock
bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = CTRL, Print, exec, grim -g "$(slurp)" - | tesseract stdin stdout 2>/dev/null | wl-copy
bind = $mainMod SHIFT, U, exec, ~/.local/bin/hypr-random-wallpaper

# Media controls match XMonad's Super+Y chord.
bind = $mainMod, Y, submap, music
submap = music
bind = , Y, exec, mpc toggle
bind = , P, exec, mpc prev
bind = , N, exec, mpc next
bind = , Escape, submap, reset
submap = reset

# Hardware controls.
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%+
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
