$mainMod = SUPER
$terminal = kitty
$menu = wofi --show drun

# Use a consistent, visible cursor in Hyprland and its child applications.
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,18

# Generic fallback for any physical or headless output; nwg-displays' explicit
# per-output rules below take precedence when present.
monitor = , preferred, auto, 1
source = ~/.config/hypr/monitors.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = waybar
exec-once = dunst
exec-once = ~/.local/bin/polkit-agent
exec-once = swayosd-server
exec-once = hyprctl setcursor Bibata-Modern-Classic 18
exec-once = hypridle
exec-once = hyprpaper
exec-once = hyprsunset
exec-once = pypr
exec-once = ~/.local/bin/hypr-random-wallpaper

input {
  kb_layout = us
  kb_variant = altgr-intl
  follow_mouse = 1

  touchpad {
    natural_scroll = true
    tap-to-click = true
    clickfinger_behavior = true
  }
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  col.active_border = rgba(FF8A3Dff) rgba(E85D1Aff) 45deg
  col.inactive_border = rgba(57434fff)
  resize_on_border = true
  layout = master
}

master {
  orientation = left
  mfact = 0.50
}

decoration {
  rounding = 8
  active_opacity = 1.0
  inactive_opacity = 0.96

  shadow {
    enabled = true
    range = 10
    render_power = 3
    color = rgba(150816ee)
  }

  blur {
    enabled = true
    size = 5
    passes = 2
    vibrancy = 0.12
  }
}

animations {
  enabled = yes
  animation = windows, 1, 2, default
  animation = windowsIn, 1, 2, default
  animation = windowsOut, 1, 2, default
  animation = workspaces, 1, 2, default
  animation = specialWorkspace, 1, 2, default
  animation = fade, 1, 2, default
}

# Pyprland manages the dropdown scratchpads and the expose overview.
# Core XMonad-compatible bindings.
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, exec, hyprctl reload
bind = $mainMod CTRL, Q, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, Q, exit
bind = $mainMod SHIFT, C, killactive
bind = $mainMod SHIFT, X, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, T, togglefloating
bind = $mainMod, V, togglefloating
bind = $mainMod CTRL, T, togglefloating

# Focus, master sizing, and window ordering.
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, M, layoutmsg, focusmaster
bind = $mainMod SHIFT, M, layoutmsg, swapwithmaster
bind = $mainMod, H, layoutmsg, mfact -0.05
bind = $mainMod, L, layoutmsg, mfact +0.05
bind = $mainMod, comma, layoutmsg, addmaster
bind = $mainMod, period, layoutmsg, removemaster
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0
bind = $mainMod CTRL SHIFT, J, layoutmsg, orientationleft
bind = $mainMod CTRL SHIFT, K, layoutmsg, orientationright
bind = $mainMod, space, layoutmsg, orientationnext
bind = $mainMod CTRL, space, layoutmsg, orientationprev
bind = $mainMod, S, exec, ~/.local/bin/hypr-toggle-border

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

# Workspaces have globally unique IDs, but navigation is scoped to the
# focused output. This works for any mix of physical and headless monitors.
bind = $mainMod, left, workspace, m-1
bind = $mainMod, right, workspace, m+1
bind = $mainMod SHIFT, left, movetoworkspace, m-1
bind = $mainMod SHIFT, right, movetoworkspace, m+1
bind = $mainMod, grave, workspace, previous_per_monitor

# The number row selects the Nth existing workspace on the focused output.
# Create a new workspace with Super+N; IDs are allocated globally at runtime.
bind = $mainMod, 1, workspace, m~1
bind = $mainMod, 2, workspace, m~2
bind = $mainMod, 3, workspace, m~3
bind = $mainMod, 4, workspace, m~4
bind = $mainMod, 5, workspace, m~5
bind = $mainMod, 6, workspace, m~6
bind = $mainMod, 7, workspace, m~7
bind = $mainMod, 8, workspace, m~8
bind = $mainMod, 9, workspace, m~9
bind = $mainMod, 0, workspace, m~10
bind = $mainMod SHIFT, 1, movetoworkspace, m~1
bind = $mainMod SHIFT, 2, movetoworkspace, m~2
bind = $mainMod SHIFT, 3, movetoworkspace, m~3
bind = $mainMod SHIFT, 4, movetoworkspace, m~4
bind = $mainMod SHIFT, 5, movetoworkspace, m~5
bind = $mainMod SHIFT, 6, movetoworkspace, m~6
bind = $mainMod SHIFT, 7, movetoworkspace, m~7
bind = $mainMod SHIFT, 8, movetoworkspace, m~8
bind = $mainMod SHIFT, 9, movetoworkspace, m~9
bind = $mainMod SHIFT, 0, movetoworkspace, m~10
bind = $mainMod, N, exec, ~/.local/bin/hypr-workspace new
bind = $mainMod CTRL, N, exec, ~/.local/bin/hypr-workspace move-new

# Cycle focus through all outputs; Ctrl+W moves the active window there.
bind = $mainMod, W, focusmonitor, +1
bind = $mainMod SHIFT, W, focusmonitor, -1
bind = $mainMod CTRL, W, movewindow, mon:+1
bind = $mainMod CTRL SHIFT, W, movewindow, mon:-1
# Spatial alternatives follow the actual layout rather than output-list order.
bind = $mainMod ALT, left, focusmonitor, l
bind = $mainMod ALT, right, focusmonitor, r
bind = $mainMod ALT, up, focusmonitor, u
bind = $mainMod ALT, down, focusmonitor, d
bind = $mainMod ALT SHIFT, left, movewindow, mon:l
bind = $mainMod ALT SHIFT, right, movewindow, mon:r
bind = $mainMod ALT SHIFT, up, movewindow, mon:u
bind = $mainMod ALT SHIFT, down, movewindow, mon:d

# Xmobar's strut toggle becomes a Waybar visibility toggle.
bind = $mainMod, B, exec, pkill -SIGUSR1 waybar

# Application shortcuts.
bind = $mainMod SHIFT, F, exec, librewolf
bind = $mainMod SHIFT, T, exec, thunar
bind = $mainMod SHIFT, E, exec, thunar
bind = $mainMod, P, exec, rofipass
bind = $mainMod, O, exec, emacsclient -ca ''
bind = $mainMod, I, exec, emacsclient -cn -e '(emacs-everywhere)'
bind = $mainMod, A, exec, ~/.local/bin/hypr-window-picker
bind = $mainMod, G, exec, ~/.local/bin/hypr-window-picker
bind = $mainMod SHIFT, G, exec, ~/.local/bin/hypr-window-picker bring

# Scratchpads, lock, and screenshots.
bind = $mainMod, BackSpace, exec, pypr toggle terminal
bind = $mainMod SHIFT, Y, exec, pypr toggle ncmpcpp
bind = $mainMod, Tab, exec, pypr expose
bind = $mainMod SHIFT, N, movetoworkspace, special:minimized
bind = $mainMod CTRL SHIFT, N, togglespecialworkspace, minimized
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod ALT, C, exec, hyprpicker -a
bind = , Print, exec, ~/.local/bin/hypr-screenshot save
bind = CTRL, Print, exec, ~/.local/bin/hypr-screenshot ocr
bind = $mainMod SHIFT, U, exec, ~/.local/bin/hypr-random-wallpaper

# Media controls match XMonad's Super+Y chord.
bind = $mainMod, Y, submap, music
submap = music
bind = , Y, exec, mpc toggle
bind = , P, exec, mpc prev
bind = , N, exec, mpc next
bind = , Escape, submap, reset
submap = reset

# Hardware controls.
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness +5
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness -5
